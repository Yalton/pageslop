# Weekly version updates, grouped into one pull request per ecosystem so they
# don't pile up. Security updates still arrive as soon as an advisory is published.
# Major npm and Docker upgrades are skipped here and done by hand, since they need
# migration work; ignoring one major at a time only makes Dependabot offer the next.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
