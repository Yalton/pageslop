services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    # POSTGRES_PASSWORD (bootstrap superuser 'pageslop') and PAGESLOP_DB_PASSWORD
    # (app role 'pageslop_app') live in .env.db, which only this service reads.
    env_file: .env.db
    environment:
      POSTGRES_USER: pageslop
      POSTGRES_DB: pageslop
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro
    # No published port: app and worker reach the database as db:5432 on the
    # compose network. For admin work use `docker compose exec db psql -U pageslop`.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pageslop"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_ALLOW_SIGNUP: ${NEXT_PUBLIC_ALLOW_SIGNUP:-true}
    restart: unless-stopped
    # Published on 127.0.0.1 by default, for a reverse proxy on the same host.
    # Set PAGESLOP_BIND=0.0.0.0 (or one interface address) in .env to expose it.
    ports:
      - "${PAGESLOP_BIND:-127.0.0.1}:${PAGESLOP_PORT:-3847}:3000"
    env_file: .env
    environment:
      # This service alone pushes the DB schema (see docker-entrypoint.sh).
      RUN_MIGRATIONS: "1"
    volumes:
      - screenshots:/app/data/screenshots
    depends_on:
      db:
        condition: service_healthy
    # Next only listens after the entrypoint's schema push finished, so an open
    # port means the schema is ready; the worker waits on this.
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(3000,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  worker:
    build: .
    restart: unless-stopped
    user: "1000:1000"
    # Permit Chromium's namespace sandbox with a browser-specific seccomp profile.
    # Source: https://github.com/microsoft/playwright/blob/main/utils/docker/seccomp_profile.json
    security_opt:
      - seccomp:./chromium-seccomp.json
    command: ["node", "--import", "tsx", "src/workers/scrape.worker.ts"]
    env_file: .env
    environment:
      HOME: /home/node
    volumes:
      - screenshots:/app/data/screenshots
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_healthy

volumes:
  screenshots:
