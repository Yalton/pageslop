services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pageslop
      POSTGRES_PASSWORD: pageslop
      POSTGRES_DB: pageslop
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pageslop"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    ports:
      - "3847:3000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://pageslop:pageslop@db:5432/pageslop
      DATABASE_URL_DIRECT: postgresql://pageslop:pageslop@db:5432/pageslop
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    restart: unless-stopped
    command: ["node", "--import", "tsx", "src/workers/scrape.worker.ts"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://pageslop:pageslop@db:5432/pageslop
      DATABASE_URL_DIRECT: postgresql://pageslop:pageslop@db:5432/pageslop
    depends_on:
      db:
        condition: service_healthy
